<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REMI – Kaķu kopēji</title>

<style>
/* // GALVENIE LAPAS STILI */
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f7f4ef;color:#333}
header{background:#fff;padding:20px;text-align:center;border-bottom:1px solid #ddd}
   
/* // REMI LOGO */
.logo{max-width:120px;height:auto}
.subtitle{font-size:18px;font-weight:bold;color:#555;margin-top:8px}
   
header h1{margin:0 0 8px}
nav a{margin:0 10px;color:#555;text-decoration:none;font-weight:bold}
main{max-width:1000px;margin:auto;padding:20px}
h2{margin-top:0}

/* // MEKLĒŠANA UN FILTRI */
.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}
input,select{padding:12px;border:1px solid #ccc;border-radius:8px;font-size:15px}

/* // KAĶU SARAKSTS */
#catList{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.cat-card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 2px 8px #0001;cursor:pointer}
.cat-card:hover{transform:translateY(-2px)}
.cat-card h3{margin-top:0}
/* // KAĶA FOTO KARTĪTĒ */
.cat-card img{width:100%;height:180px;object-fit:cover;border-radius:10px;margin-bottom:10px}

/* // KAĶA PROFILS */
#profile{display:none;background:#fff;padding:22px;border-radius:12px;box-shadow:0 2px 8px #0001}
.profile-row{margin:10px 0}
.profile-photo{width:220px;max-width:100%;height:auto;border-radius:12px;display:block;margin:0 auto 20px}
.back{display:inline-block;margin-bottom:20px;cursor:pointer;font-weight:bold}

/* // KĀJENE */
footer{text-align:center;padding:30px;color:#777}
</style>
</head>

<body>

<!-- // GALVENE -->
<header>
<img src="remilogo.jpg" alt="REMI" class="logo">
<div class="subtitle">KAĶU KOPĒJI</div>
</header>

<main>

<!-- // KAĶU SADAĻA -->
<section id="cats">

<h2>Kaķu palīdzības centrs REMI</h2>
<p>Iekšējā vietne REMI kaķu kopējiem.</p>

<!-- // MEKLĒŠANA UN FILTRĒŠANA -->
<div class="controls">

<input id="search" type="text"
placeholder="🔍 Meklēt pēc kaķa vārda..."
oninput="showCats()">

<!-- // FILTRS PĒC KOPTELPAS -->
<select id="room" onchange="showCats()">
<option value="">Visas koptelpas</option>
<option value="1">Koptelpa 1</option>
<option value="2">Koptelpa 2</option>
<option value="3">Koptelpa 3</option>
<option value="4">Koptelpa 4</option>
<option value="5">Koptelpa 5</option>
<option value="6">Koptelpa 6</option>
<option value="7">Karantīna 1</option>
<option value="8">Karantīna 2</option>
</select>

<!-- // FILTRS PĒC DZIMUMA -->
<select id="sex" onchange="showCats()">
<option value="">Runči un kaķenes</option>
<option value="Runcis">Runči</option>
<option value="Kaķene">Kaķenes</option>
</select>

<!-- // KAĶU KĀRTOŠANA -->
<select id="sort" onchange="showCats()">
<option value="name">Vārds A–Z</option>
<option value="age">Vecums</option>
</select>

</div>

<!-- // ŠEIT TIKS PARĀDĪTI VISI KAĶI -->
<div id="catList"></div>

</section>


<!-- // KAĶA PROFILA SADAĻA -->
<section id="profile">

<span class="back" onclick="closeProfile()">← Atpakaļ pie kaķiem</span>

<img id="profilePhoto" class="profile-photo" alt="Kaķa foto">

<h2 id="profileName"></h2>

<div class="profile-row">
<b>Dzimums:</b> <span id="profileSex"></span>
</div>

<div class="profile-row">
<b>Vecums:</b> <span id="profileAge"></span>
</div>

<div class="profile-row">
<b>Vieta:</b> <span id="profileRoom"></span>
</div>

<hr>

<div class="profile-row">
<b>Raksturs:</b><br>
<span id="profileCharacter"></span>
</div>

<div class="profile-row">
<b>Barošana:</b><br>
<span id="profileFeeding"></span>
</div>

<div class="profile-row">
<b>Veselība:</b><br>
<span id="profileHealth"></span>
</div>

<div class="profile-row">
<b>Īpašas piezīmes:</b><br>
<span id="profileNotes"></span>
</div>

</section>

</main>


<!-- // KĀJENE -->
<footer>
REMI – Kaķu palīdzības centrs
</footer>


<script>

/* // =========================================================
   // KAĶU DATI
   // ========================================================= */

const cats={

Mince:{
name:"Mince",
sex:"Kaķene",
birthDate:"2017-06-26",
photo:"Mince.png",
room:"1",
character:"Mīļa, draudzīga.",
feeding:"-",
health:"FIV/FeLV -/-",
notes:"No Slokas patversmes."
},

Minka:{
name:"Minka",
sex:"Kaķene",
birthDate:"2024-03-20",
room:"1",
character:"Minka ir mierīga un mīļa.",
feeding:"Barot saskaņā ar REMI noteikto barošanas kārtību.",
health:"Nav medikamentu.",
notes:"Patīk mierīga uzmanība."
},

Pūka:{
name:"Pūka",
sex:"Kaķene",
birthDate:"2018-08-10",
room:"2",
character:"Pūka ir mierīga un neatkarīga.",
feeding:"Barot saskaņā ar REMI noteikto barošanas kārtību.",
health:"Nav medikamentu.",
notes:"Dod laiku pierast pie jauniem cilvēkiem."
}

};


/* // =========================================================
   // APRĒĶINA KAĶA VECUMU
   // ŠIS KODS AUTOMĀTISKI APRĒĶINA PILNOS GADUS.
   // ========================================================= */

function getAge(birthDate){

const birth=new Date(birthDate);
const today=new Date();

let age=today.getFullYear()-birth.getFullYear();

const monthDifference=today.getMonth()-birth.getMonth();

if(
monthDifference<0 ||
(monthDifference===0 && today.getDate()<birth.getDate())
){
age--;
}

return age+" gadi";

}


/* // =========================================================
   // KOPTELPU NOSAUKUMI
   // ========================================================= */

const rooms={
"1":"Koptelpa 1",
"2":"Koptelpa 2",
"3":"Koptelpa 3",
"4":"Koptelpa 4",
"5":"Koptelpa 5",
"6":"Koptelpa 6",
"7":"Karantīna 1",
"8":"Karantīna 2"
};


/* // =========================================================
   // PARĀDA KAĶU SARAKSTU
   // IZVEIDO KAĶU KARTĪTES UN FILTRĒ TĀS.
   // ========================================================= */

function showCats(){

const search=document.getElementById("search").value.toLowerCase();
const room=document.getElementById("room").value;
const sex=document.getElementById("sex").value;
const sort=document.getElementById("sort").value;

let list=Object.values(cats).filter(cat=>
cat.name.toLowerCase().includes(search) &&
(!room || cat.room===room) &&
(!sex || cat.sex===sex)
);


/* // KĀRTO KAĶUS PĒC VĀRDA */
if(sort==="name"){
list.sort((a,b)=>a.name.localeCompare(b.name));
}


/* // KĀRTO KAĶUS PĒC VECUMA */
if(sort==="age"){
list.sort((a,b)=>
new Date(a.birthDate)-new Date(b.birthDate)
);
}


/* // IZVEIDO KAĶU KARTĪTES */
document.getElementById("catList").innerHTML=list.map(cat=>`

<div class="cat-card" onclick="openProfile('${cat.name}')">

<img src="${cat.photo}" alt="${cat.name}">

<h3>🐱 ${cat.name}</h3>

<p>${cat.sex} · ${getAge(cat.birthDate)}</p>

<p>📍 ${rooms[cat.room]}</p>

</div>

`).join("");

}


/* // =========================================================
   // ATVĒRT KAĶA PROFILU
   // ========================================================= */

function openProfile(name){

const cat=cats[name];

document.getElementById("cats").style.display="none";
document.getElementById("profile").style.display="block";

document.getElementById("profileName").textContent=" "+cat.name;
document.getElementById("profilePhoto").src=cat.photo;
document.getElementById("profileSex").textContent=cat.sex;
document.getElementById("profileAge").textContent=getAge(cat.birthDate);
document.getElementById("profileRoom").textContent=rooms[cat.room];
document.getElementById("profileCharacter").textContent=cat.character;
document.getElementById("profileFeeding").textContent=cat.feeding;
document.getElementById("profileMedication").textContent=cat.medication;
document.getElementById("profileNotes").textContent=cat.notes;

window.scrollTo(0,0);

}


/* // =========================================================
   // AIZVER KAĶA PROFILU
   // ========================================================= */

function closeProfile(){

document.getElementById("profile").style.display="none";
document.getElementById("cats").style.display="block";

}


/* // =========================================================
   // PALAIŽ KAĶU SARAKSTU
   // ========================================================= */

showCats();

</script>

</body>
</html>
