*{box-sizing:border-box}

.back{display:inline-block;margin-bottom:20px;cursor:pointer;font-weight:bold}

/* // =========================================================
   // APRĒĶINA KAĶA VECUMU
   // ŠIS KODS AUTOMĀTISKI APRĒĶINA PILNOS GADUS.
   // ========================================================= */

function getAge(birthDate){

const birth=new Date(birthDate);
const today=new Date();

let age=today.getFullYear()-birth.getFullYear();

const monthDifference=today.getMonth()-birth.getMonth();

if(
monthDifference<0 ||
(monthDifference===0 && today.getDate()<birth.getDate())
){
age--;
}

return age+" gadi";

}


/* // =========================================================
   // KOPTELPU NOSAUKUMI
   // ========================================================= */

const rooms={
"1":"Koptelpa 1",
"2":"Koptelpa 2",
"3":"Koptelpa 3",
"4":"Koptelpa 4",
"5":"Koptelpa 5",
"6":"Koptelpa 6",
"7":"Karantīna 1",
"8":"Karantīna 2"
};


/* // =========================================================
   // PARĀDA KAĶU SARAKSTU
   // IZVEIDO KAĶU KARTĪTES UN FILTRĒ TĀS.
   // ========================================================= */

function showCats(){

const search=document.getElementById("search").value.toLowerCase();
const room=document.getElementById("room").value;
const sex=document.getElementById("sex").value;
const sort=document.getElementById("sort").value;

let list=Object.values(cats).filter(cat=>
cat.name.toLowerCase().includes(search) &&
(!room || cat.room===room) &&
(!sex || cat.sex===sex)
);


/* // KĀRTO KAĶUS PĒC VĀRDA */
if(sort==="name"){
list.sort((a,b)=>a.name.localeCompare(b.name));
}


/* // KĀRTO KAĶUS NO VECĀKĀ UZ JAUNĀKO */
if(sort==="oldest"){
list.sort((a,b)=>
new Date(a.birthDate)-new Date(b.birthDate)
);
}

/* // KĀRTO KAĶUS NO JAUNĀKĀ UZ VECĀKO */
if(sort==="youngest"){
list.sort((a,b)=>
new Date(b.birthDate)-new Date(a.birthDate)
);
}


/* // IZVEIDO KAĶU KARTĪTES */
document.getElementById("catList").innerHTML=list.map(cat=>`

<div class="cat-card" onclick="openProfile('${cat.name}')">

<img src="${cat.photo}" alt="${cat.name}">

<h3>🐱 ${cat.name}</h3>

<p>${cat.sex} · ${getAge(cat.birthDate)}</p>

<p>📍 ${rooms[cat.room]}</p>

</div>

`).join("");

}


/* // =========================================================
   // ATVĒRT KAĶA PROFILU
   // ========================================================= */

function openProfile(name){

const cat=cats[name];

document.getElementById("cats").style.display="none";
document.getElementById("profile").style.display="block";

document.getElementById("profileName").textContent=" "+cat.name;
document.getElementById("profilePhoto").src=cat.photo;
document.getElementById("profileSex").textContent=cat.sex;
document.getElementById("profileAge").textContent=getAge(cat.birthDate);
document.getElementById("profileRoom").textContent=rooms[cat.room];
document.getElementById("profileCharacter").textContent=cat.character;
document.getElementById("profileFeeding").textContent=cat.feeding;
document.getElementById("profileHealth").textContent=cat.health;
document.getElementById("profileNotes").textContent=cat.notes;

window.scrollTo(0,0);

}


/* // =========================================================
   // AIZVER KAĶA PROFILU
   // ========================================================= */

function closeProfile(){

document.getElementById("profile").style.display="none";
document.getElementById("cats").style.display="block";

}


/* // =========================================================
   // PALAIŽ KAĶU SARAKSTU
   // ========================================================= */

showCats();

</script>
